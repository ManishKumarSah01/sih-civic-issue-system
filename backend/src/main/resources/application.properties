spring.application.name=civic-issue-system
server.port=8080

# ── H2 In-Memory Database (no MySQL install required) ──────────────────
spring.datasource.url=jdbc:h2:mem:civic_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── File upload ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── JWT ────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:sih-civic-demo-secret-key-replace-in-prod-32chars}
app.jwt.expiration-ms=86400000

# ── File storage ───────────────────────────────────────────────────────
app.upload-dir=${UPLOAD_DIR:uploads}

# ── CORS ───────────────────────────────────────────────────────────────
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ── Mail (disabled — leave blank to skip email sending) ───────────────
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
